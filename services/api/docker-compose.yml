
# ─────────────────────────────────────────────────────────────────────────────
# Connecting Dots API — local development stack
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   backend   – FastAPI app (hot-reload via volume mount)
#   postgres  – PostgreSQL 16
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  APP_ENV: development
  DEBUG: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ai_context_workspace
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  LOG_LEVEL: DEBUG
  LOG_FORMAT: console
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"

services:

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      target: runtime          # skip builder stage in local dev if desired
    image: ai-context-workspace:dev
    container_name: acw_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount source so uvicorn --reload picks up changes
      - .:/app
    # Secrets (JWT_SECRET_KEY, OPENAI_API_KEY, …) come from services/api/.env —
    # copy .env.example. The environment block below wins for the database host.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
    # Migrate first so a fresh database is usable straight away.
    command: >
      sh -c "alembic upgrade head && uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app
        --log-level debug"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acw_net

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: acw_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"            # expose for local DB tools (TablePlus, DBeaver…)
    environment:
      POSTGRES_DB: ai_context_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_context_workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - acw_net

volumes:
  postgres_data:

networks:
  acw_net:
    driver: bridge
