[tool.pytest.ini_options]
asyncio_mode = "auto"
# Deliberately NOT set: this project mixes a session-scoped async fixture
# (_test_schema) with function-scoped ones (db_session) in tests/conftest.py.
# Setting asyncio_default_fixture_loop_scope to "session" deferred
# async-generator fixture teardown (db_session's post-yield rollback/
# dispose) until the whole test session ended instead of after each test,
# leaving every test's DB connection "idle in transaction" server-side and
# eventually deadlocking on table locks (confirmed live via
# pg_stat_activity). Setting it to "function" instead breaks because
# _test_schema itself needs session scope. Leaving it unset triggers a
# pytest-asyncio deprecation warning (harmless — this project already
# tolerates one from Starlette) but is the configuration that actually
# works correctly today.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "-q",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # do not perform function calls in argument defaults (FastAPI Depends)
