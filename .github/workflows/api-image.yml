name: API image

# Builds the API image and pushes it to ghcr.io on every push that changes
# services/api, without cutting a release. Tags:
#   sha-<short commit>  one per build, for pinning a deploy
#   edge                the newest build
# `latest` and version tags stay with release.yml.
# Run it by hand from the Actions tab too (workflow_dispatch).

on:
  push:
    branches: [main, "week*/**"]
    paths:
      - "services/api/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push the API image to ghcr.io

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          # The repo name ends in "-", which is not a valid image name, so
          # the image is named after the project instead (as in release.yml).
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/connecting-dots-api"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SHA_TAG: ${{ steps.names.outputs.sha_tag }}
        run: |
          set -o pipefail
          if ! docker build --progress=plain --target runtime \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$IMAGE:$SHA_TAG" -t "$IMAGE:edge" . 2>&1 | tee build.log; then
            # Annotations are readable without signing in; the log is not.
            echo "::error title=docker build failed::$(tail -n 25 build.log | tr '\n' '|' | cut -c1-3500)"
            exit 1
          fi

      - name: No secrets in the image
        run: |
          # Never ship a secret baked into the image (see .dockerignore).
          if docker run --rm --entrypoint sh "${{ steps.names.outputs.image }}:${{ steps.names.outputs.sha_tag }}" -c 'test -e /app/.env'; then
            echo "::error::.env is inside the image"
            exit 1
          fi

      - name: CPU-only torch, models load and rank correctly
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.sha_tag }}
        run: |
          set -o pipefail
          # A throwaway JWT key: app settings refuse to load without one.
          out=$(docker run --rm -e JWT_SECRET_KEY=ci-model-check-not-a-real-secret-0123456789 --entrypoint sh "$IMAGE" -c '
            if pip list --format=freeze | grep -iE "^(nvidia-|cuda-|triton=)"; then echo "GPU packages found"; exit 1; fi
            python - <<EOF
          import torch
          assert torch.version.cuda is None, f"CUDA build of torch: {torch.__version__}"
          from app.core.rag import embedder, pipeline
          v = embedder.embed_query("how do I reset my password")
          assert len(v) == 384, len(v)
          r = pipeline._get_reranker()
          good, bad = r.predict([
              ("how do I reset my password", "To reset your password, click Forgot password on the login page."),
              ("how do I reset my password", "Bananas are a good source of potassium."),
          ])
          assert good > bad, (good, bad)
          print(f"torch {torch.__version__} (cuda={torch.version.cuda}) | embedder {embedder._get_model().device} 384-d | reranker {r.model.device} good={good:.2f} bad={bad:.2f}")
          EOF
          ' 2>&1) || { echo "$out"; echo "::error title=CPU/model check failed::$(echo "$out" | tail -n 15 | tr '\n' '|')"; exit 1; }
          echo "$out" | tail -n 1
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE")
          echo "::notice title=CPU check passed::$(echo "$out" | tail -n 1) | uncompressed image $((size / 1048576)) MB"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          SHA_TAG: ${{ steps.names.outputs.sha_tag }}
        run: |
          for tag in "$SHA_TAG" edge; do
            if ! out=$(docker push "$IMAGE:$tag" 2>&1); then
              echo "$out"
              echo "::error title=docker push failed::$(echo "$out" | tail -n 10 | tr '\n' '|')"
              exit 1
            fi
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SHA_TAG")
          id=$(docker inspect --format '{{.Id}}' "$IMAGE:$SHA_TAG")
          echo "::notice title=API image pushed::$IMAGE:$SHA_TAG | digest $digest | image ID $id"
          {
            echo "### API image"
            echo "- \`$IMAGE:$SHA_TAG\`"
            echo "- \`$IMAGE:edge\`"
            echo "- digest: \`$digest\`"
            echo "- image ID: \`$id\`"
          } >> "$GITHUB_STEP_SUMMARY"
