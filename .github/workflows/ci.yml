name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  # A throwaway secret for tests and the e2e stack only — never a real one.
  JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-real-0123456789abcdef

jobs:
  extension:
    name: Extension — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist-development
          path: apps/extension/dist
          retention-days: 7

  dashboard:
    name: Dashboard — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: No localhost in shipped frontend code
        working-directory: .
        run: node scripts/check-no-localhost.mjs

  api:
    name: API — ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # conftest.py runs tests against "<POSTGRES_DB>_test".
          POSTGRES_DB: ai_context_workspace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_DB: ai_context_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install (CPU-only torch keeps the install small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Bug-class rules only for now (syntax errors, undefined names, unused
      # imports/variables); the full style ruleset is a separate cleanup.
      - run: ruff check app main.py tests --select E9,F
      - run: pytest

  e2e:
    name: End-to-end — dashboard core loop
    runs-on: ubuntu-latest
    needs: [dashboard, api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_context_workspace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_DB: ai_context_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      ALLOWED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            e2e/package-lock.json

      - name: Start the API
        working-directory: services/api
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > ../../api.log 2>&1 &

      - name: Build and start the dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
          nohup npm run start -- --port 3000 > ../../dashboard.log 2>&1 &

      - name: Wait for both
        run: |
          for url in http://127.0.0.1:8000/api/v1/health http://127.0.0.1:3000/login; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null && break; sleep 2; done
            curl -fsS "$url" > /dev/null || { echo "$url did not come up"; exit 1; }
          done

      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs and report on failure
        if: failure()
        run: tail -n 200 api.log dashboard.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
